syntax = "proto3";
package com.tencent.easygraph.model;

message Value {
  oneof oneof_value {
    int32 int_value       = 1;
    int64 long_value      = 2;
    string string_value   = 3;
    double double_value   = 4;
  }
  ValueType value_type = 5;
}

enum ValueType {
  INT = 0;
  LONG = 1;
  STRING = 2;
  DOUBLE = 3;
}
